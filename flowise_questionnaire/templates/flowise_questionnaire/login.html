<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Questionnaire System Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 420px;
            background: #ffffff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.10);
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .button {
            width: 100%;
            padding: 11px 14px;
            background: #1f2937;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .messages {
            margin-bottom: 16px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
            margin-bottom: 8px;
        }

        .hint {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h1>Questionnaire System</h1>
    <p class="hint">Log in to upload and process questionnaire JSON modules.</p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required autofocus>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
        </div>

        <button class="button" type="submit">Log in</button>
    </form>
</div>
</body>
</html>
